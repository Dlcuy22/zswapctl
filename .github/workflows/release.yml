name: Release Build Matrix

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        goarch: [amd64, arm]
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      BINARY: zswapctl-linux-${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: |
          go build -ldflags "-s -w -X github.com/zswap-go/zswapctl/internal/version.Version=${{ inputs.version }}" -o $BINARY ./cmd/zswapctl
          chmod 755 $BINARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}
          path: ${{ env.BINARY }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List files
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: |
            ## Automatic Build

            Automated release for version v${{ inputs.version }}.
          draft: false
          prerelease: false
          files: |
            zswapctl-linux-amd64/zswapctl-linux-amd64
            zswapctl-linux-arm/zswapctl-linux-arm
